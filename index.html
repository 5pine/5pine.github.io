<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Elsie Tesla</title>
<style>
  body{font:16px/1.4 system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem}
  code{word-break:break-all;background:#f4f4f4;padding:.2rem .4rem;display:block;margin:1rem 0}
</style>
<h1>Elsie Tesla key host</h1>
<p>Public key for vehicle commands is published under <code>/.well-known/appspecific/com.tesla.3p.public-key.pem</code>.</p>
<p id="status"></p>
<code id="code"></code>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code');
const err = p.get('error');
const desc = p.get('error_description');
const status = document.getElementById('status');
const box = document.getElementById('code');
if (err) {
  status.textContent = 'Authorization failed: ' + err + (desc ? ' — ' + desc : '');
} else if (code) {
  status.textContent = 'Tesla authorization succeeded. Leave this tab open so Elsie can finish.';
  box.textContent = code;
}
</script>
